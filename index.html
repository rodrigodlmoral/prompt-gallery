<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Gallery - Premium AI Art</title>
  <meta name="description"
    content="Descubre y comparte los mejores prompts para Gemini, Grok, Meta AI y más. Arma tu galería y monetiza tu talento." />

  <!-- OpenGraph / Social Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Prompt Gallery - Premium AI Art" />
  <meta property="og:description"
    content="La mejor galería de prompts e imágenes de IA. ¡Crea tu perfil y comparte tus obras!" />
  <meta property="og:image" content="https://prompt-gallery-v2.vercel.app/og-preview.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
  <div id="app">
    <div
      style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#666; font-family:sans-serif">
      <div style="font-size:3rem; animation: pulse 1s infinite">✨</div>
      <p style="margin-top:20px; letter-spacing:1px; font-size:0.9rem">CARGANDO GALERÍA...</p>
      <style>
        @keyframes pulse {
          0% {
            opacity: 0.5;
            transform: scale(0.9);
          }

          50% {
            opacity: 1;
            transform: scale(1.1);
          }

          100% {
            opacity: 0.5;
            transform: scale(0.9);
          }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
