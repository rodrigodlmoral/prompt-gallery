<body>
  <div id="app">
    <!-- El JS inyectará el contenido aquí -->
    <div
      style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#666; font-family:sans-serif">
      <div style="font-size:3rem; animation: pulse 1s infinite">💎</div>
      <p style="margin-top:20px; letter-spacing:1px; font-size:0.9rem">CARGANDO BATCH UPLOAD...</p>
      <style>
        @keyframes pulse {
          0% {
            opacity: 0.5;
            transform: scale(0.9);
          }

          50% {
            opacity: 1;
            transform: scale(1.1);
          }

          100% {
            opacity: 0.5;
            transform: scale(0.9);
          }
        }
      </style>

  </div>
