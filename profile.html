<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario | Prompt Gallery</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="dark-mode">
    <div id="profile-app">
        <div
            style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#666; font-family:sans-serif">
            <div style="font-size:3rem; animation: pulse 1s infinite">✨</div>
            <p style="margin-top:20px; letter-spacing:1px; font-size:0.9rem">CARGANDO PERFIL...</p>
            <style>
                @keyframes pulse {
                    0% {
                        opacity: 0.5;
                        transform: scale(0.9);
                    }

                    50% {
                        opacity: 1;
                        transform: scale(1.1);
                    }

                    100% {
                        opacity: 0.5;
                        transform: scale(0.9);
                    }
                }
            </style>
        </div>
    </div>
    <script type="module" src="/src/profile.js"></script>
</body>

</html>
