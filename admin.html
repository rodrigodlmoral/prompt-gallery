<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👑 Admin Panel - Prompt Gallery</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body style="background: #000; color: #fff; margin: 0; font-family: 'Inter', sans-serif;">
  <div id="admin-app">
    <div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#666;">
      <div style="font-size:3rem; animation: pulse 1s infinite">👑</div>
      <p style="margin-top:20px; letter-spacing:1px; font-size:0.9rem">CARGANDO PANEL DE CONTROL...</p>
      <style>
        @keyframes pulse {
          0% { opacity: 0.5; transform: scale(0.9); }
          50% { opacity: 1; transform: scale(1.1); }
          100% { opacity: 0.5; transform: scale(0.9); }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/admin.js"></script>
</body>

</html>
